name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Sur Windows, la sortie standard n'utilise pas UTF-8 par défaut quand
  # elle est redirigée (le cas en CI) avant Python 3.15 — or le code et les
  # messages d'exception sont en français avec accents partout. Sans ça,
  # un simple print() ou une exception affichée peut planter avec
  # UnicodeEncodeError, sans rapport avec un vrai bug du code.
  PYTHONUTF8: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies (avec extras files)
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest

  core-only-import:
    name: Import sans les extras optionnelles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Installer uniquement le paquet de base (sans l'extra "files")
        run: uv pip install --system -e .

      - name: Vérifier que le paquet de base fonctionne sans openpyxl/python-docx/fpdf2/Pillow
        run: python scripts/check_core_only_import.py
