[project]
name = "local-fake"
version = "0.1.0"
description = "Générateur de fausses données (façon Faker) localisées pour l'Afrique : numéros, adresses textuelles, KYC, Mobile Money — avec génération optionnelle de fichiers de test (PDF/Word/PNG/SVG/Excel)."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
keywords = ["faker", "fake-data", "testing", "africa", "localization", "kyc", "mobile-money"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
files = [
    "fpdf2>=2.8.7",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "fpdf2>=2.8.7",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_fake"]
